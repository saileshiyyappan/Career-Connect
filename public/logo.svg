<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Gradients -->
    <radialGradient id="globeGlow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Cap Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- 3D C1 Gradient (Blue) -->
    <linearGradient id="blueCGrad" x1="0%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="25%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- 3D C2 Gradient (Crimson/Magenta) -->
    <linearGradient id="magentaCGrad" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="20%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="85%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Road / Skyline Gradients -->
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#dropShadow3D)">
    <!-- 1. Left Network Globe -->
    <g transform="translate(140, 260)">
      <circle cx="100" cy="100" r="90" fill="url(#globeGlow)" />
      <!-- Globe Latitude / Longitude lines -->
      <ellipse cx="100" cy="100" rx="90" ry="36" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.6" />
      <ellipse cx="100" cy="100" rx="90" ry="68" fill="none" stroke="#BAE6FD" stroke-width="2" opacity="0.4" />
      <ellipse cx="100" cy="100" rx="36" ry="90" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.6" />
      <ellipse cx="100" cy="100" rx="68" ry="90" fill="none" stroke="#BAE6FD" stroke-width="2" opacity="0.4" />
      <!-- Globe Network Nodes & Links -->
      <line x1="50" y1="70" x2="90" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
      <line x1="90" y1="50" x2="140" y2="80" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
      <line x1="140" y1="80" x2="160" y2="130" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
      <line x1="90" y1="50" x2="100" y2="120" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
      <circle cx="50" cy="70" r="5" fill="#FFFFFF" />
      <circle cx="90" cy="50" r="6" fill="#FFFFFF" />
      <circle cx="140" cy="80" r="5.5" fill="#FFFFFF" />
      <circle cx="160" cy="130" r="5" fill="#FFFFFF" />
      <circle cx="100" cy="120" r="5" fill="#FFFFFF" />
    </g>

    <!-- 2. Briefcase (Bottom Left) -->
    <g transform="translate(110, 480)">
      <!-- Briefcase Body -->
      <rect x="20" y="30" width="130" height="95" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="3" />
      <rect x="25" y="35" width="120" height="85" rx="14" fill="#1E293B" />
      <!-- Leather accent crease -->
      <path d="M 20 65 L 150 65" stroke="#0F172A" stroke-width="3" />
      <!-- Golden Clasp -->
      <rect x="73" y="55" width="24" height="20" rx="4" fill="url(#goldGrad)" />
      <circle cx="85" cy="65" r="3" fill="#713F12" />
      <!-- Handle -->
      <path d="M 60 30 C 60 12, 110 12, 110 30" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
      <!-- Decorative Organic Leaves beside briefcase -->
      <path d="M 15 85 C -5 65, 0 40, 25 45 C 30 65, 25 80, 15 85 Z" fill="#0284C7" opacity="0.9" />
      <path d="M 10 105 C -15 95, -10 70, 15 80 C 20 95, 18 105, 10 105 Z" fill="#38BDF8" opacity="0.9" />
    </g>

    <!-- 3. Dynamic Upward Golden Growth Arrow (Right) -->
    <g transform="translate(480, 270)">
      <!-- Sweeping Gold Arc -->
      <path d="M -120 320 C -20 320, 120 260, 200 60 L 250 85 L 240 -30 L 130 -10 L 175 15 C 100 180, -20 240, -120 250 Z" fill="url(#arrowGrad)" />
      <!-- 3D under-bevel for arrow -->
      <path d="M -120 320 C -20 320, 120 260, 200 60 L 175 15 C 100 180, -20 240, -120 250 Z" fill="#B45309" opacity="0.4" />
    </g>

    <!-- 4. Left 3D Blue Monogram 'C' -->
    <g transform="translate(230, 280)">
      <!-- Outer C Shape -->
      <path d="M 180 40 C 90 40, 20 105, 20 200 C 20 295, 90 360, 180 360 C 225 360, 260 340, 280 315 L 235 270 C 220 285, 200 295, 180 295 C 125 295, 85 255, 85 200 C 85 145, 125 105, 180 105 C 205 105, 225 115, 240 130 L 285 85 C 260 55, 225 40, 180 40 Z" fill="url(#blueCGrad)" />
      
      <!-- Inner Candidate Avatar Silhouette inside Blue C -->
      <g transform="translate(130, 140)">
        <!-- Head -->
        <circle cx="50" cy="35" r="24" fill="#0F172A" stroke="#FFFFFF" stroke-width="4" />
        <!-- Suit Torso & Tie -->
        <path d="M 15 105 C 15 70, 85 70, 85 105 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="4" />
        <!-- White Shirt Collar & Tie -->
        <polygon points="50,70 42,85 58,85" fill="#FFFFFF" />
        <polygon points="46,85 54,85 52,105 48,105" fill="#0284C7" />
      </g>
    </g>

    <!-- 5. Right 3D Magenta/Crimson Monogram 'C' -->
    <g transform="translate(410, 280)">
      <!-- Outer C Shape -->
      <path d="M 180 40 C 90 40, 20 105, 20 200 C 20 295, 90 360, 180 360 C 225 360, 260 340, 280 315 L 235 270 C 220 285, 200 295, 180 295 C 125 295, 85 255, 85 200 C 85 145, 125 105, 180 105 C 205 105, 225 115, 240 130 L 285 85 C 260 55, 225 40, 180 40 Z" fill="url(#magentaCGrad)" />

      <!-- Inner City Skyline & Highway inside Magenta C -->
      <g transform="translate(60, 120)">
        <!-- Skyline Bars -->
        <rect x="50" y="70" width="12" height="45" rx="2" fill="#0284C7" />
        <rect x="66" y="50" width="14" height="65" rx="2" fill="#0369A1" />
        <rect x="84" y="30" width="16" height="85" rx="2" fill="#0284C7" />
        <rect x="104" y="55" width="12" height="60" rx="2" fill="#38BDF8" />
        <rect x="120" y="75" width="10" height="40" rx="2" fill="#0369A1" />

        <!-- Curving Forward Highway Road -->
        <path d="M 40 180 C 70 180, 110 160, 130 110 L 150 115 C 130 180, 80 210, 40 210 Z" fill="url(#roadGrad)" />
        <!-- Road center dashes -->
        <path d="M 50 195 C 80 185, 110 165, 125 125" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,6" />
      </g>
    </g>

    <!-- 6. Graduation Mortarboard Cap (Top Crown) -->
    <g transform="translate(210, 90)">
      <!-- Skull cap under base -->
      <ellipse cx="190" cy="180" rx="140" ry="40" fill="#0F172A" />
      <!-- Golden rim band around cap opening -->
      <ellipse cx="190" cy="178" rx="140" ry="16" fill="none" stroke="url(#goldGrad)" stroke-width="8" />

      <!-- Diamond Mortarboard Top -->
      <polygon points="190,40 375,125 190,205 5,125" fill="url(#capGrad)" stroke="#1E293B" stroke-width="3" />
      <!-- 3D Bevel highlight on cap -->
      <polygon points="190,40 375,125 190,205" fill="#334155" opacity="0.25" />

      <!-- Center Gold Button on Cap -->
      <ellipse cx="190" cy="122" rx="12" ry="8" fill="url(#goldGrad)" />

      <!-- Golden Tassel draping left -->
      <path d="M 190 122 C 140 125, 95 160, 85 240" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <!-- Hanging Tassel Fringe -->
      <rect x="73" y="240" width="24" height="48" rx="6" fill="url(#goldGrad)" />
      <!-- Tassel ring band -->
      <rect x="71" y="246" width="28" height="6" rx="2" fill="#713F12" />
      <line x1="77" y1="256" x2="77" y2="284" stroke="#713F12" stroke-width="2" />
      <line x1="85" y1="256" x2="85" y2="284" stroke="#713F12" stroke-width="2" />
      <line x1="93" y1="256" x2="93" y2="284" stroke="#713F12" stroke-width="2" />
    </g>

  </g>

  <!-- 7. Brand Typography Base -->
  <g transform="translate(80, 650)">
    <!-- "Career" Text in Deep Slate -->
    <text x="75" y="70" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" fill="#0F172A">
      Career<tspan fill="#E11D48">Connect</tspan>
    </text>

    <!-- Gradient Tagline Bar -->
    <g transform="translate(75, 95)">
      <!-- Left Blue-Purple Pill -->
      <rect x="0" y="4" width="85" height="8" rx="4" fill="url(#blueCGrad)" />
      
      <!-- Tagline Text -->
      <text x="102" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.2" fill="#1E293B">
        Your Skills. Our Network. Your Success.
      </text>

      <!-- Right Crimson Accent Pill -->
      <rect x="525" y="4" width="85" height="8" rx="4" fill="#E11D48" />
    </g>
  </g>
</svg>
